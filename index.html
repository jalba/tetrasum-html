<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tetrasum-html/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tetrasum-poc</title>
    <script
      type="module"
      crossorigin
      src="/tetrasum-html/assets/index-D1oCPxFd.js"
    ></script>
    <link
      rel="stylesheet"
      crossorigin
      href="/tetrasum-html/assets/index-D11Z6VfM.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <dialog class="win-dialog splash">
      <div class="modal-header">
        <img src="/tetrasum-html/you_won.svg" alt="You won!!" />
      </div>
      <div class="modal-body">
        <slot name="body">
          <p>Play again?</p>
        </slot>
      </div>
      <div class="modal-footer">
        <slot name="footer">
          <div class="actions-wrapper">
            <button class="actions new-game">New game</button>
            <button class="actions close">Cancel</button>
          </div>
        </slot>
      </div>
    </dialog>
    <dialog class="new-game-dialog splash">
      <div class="modal-header">
        <slot name="header">
          <img src="/tetrasum-html/new_game.svg" />
        </slot>
      </div>
      <div class="modal-body">
        <slot name="body">
          <p>Are you sure you want to start a new game?</p>
        </slot>
      </div>
      <div class="modal-footer">
        <slot name="footer">
          <div class="actions-wrapper">
            <button class="actions new-game">New game</button>
            <button class="actions close">Cancel</button>
          </div>
        </slot>
      </div>
    </dialog>
    <dialog class="settings splash">
      <div class="modal-header">
        <slot name="header">
          <img src="/tetrasum-html/options.svg" alt="options" />
        </slot>
      </div>
      <div class="modal-body">
        <slot name="body">
          <div class="actions-wrapper">
            <button class="actions new-game">New game</button>
            <button class="actions how-to">How to play?</button>
          </div>
        </slot>
      </div>
      <div class="modal-footer">
        <slot name="footer">
          <div class="actions-wrapper">
            <button class="actions cancel">Cancel</button>
          </div>
        </slot>
      </div>
    </dialog>
    <dialog class="how-to-dialog">
      <div class="modal-header">
        <slot name="header">
          <img src="/tetrasum-html/how_to_play.svg" alt="How to play?" />
        </slot>
      </div>
      <div class="modal-body">
        <slot name="body">
          <img src="/tetrasum-html/tetrasum.gif" />
          <p>
            The objective of the game is to sum up squares so that you finish in
            one of the light blue target squares:
          </p>
          <img class="explain" src="/tetrasum-html/target.png" />
          <p>with the amount indicated by the solution squares:</p>
          <img class="explain" src="/tetrasum-html/solution.png" />
        </slot>
      </div>
      <div class="modal-footer">
        <slot name="footer">
          <button class="actions got-it">&nbsp;&nbsp;Got it&nbsp;&nbsp;</button>
        </slot>
      </div>
    </dialog>
    <dialog class="entry splash">
      <div class="modal-header">
        <slot name="header">
          <img src="/tetrasum-html/tetraadd.svg" alt="Tetradd" />
          <img class="logo" src="/tetrasum-html/logo.svg" alt="Let's play" />
        </slot>
      </div>
      <div class="modal-body">
        <slot name="body">
          <div class="actions-wrapper">
            <button class="actions">Start a new game</button>
            <button class="actions how-to">How to play?</button>
          </div>
        </slot>
      </div>
    </dialog>
  </body>
</html>
